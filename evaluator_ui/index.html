<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PathSnap Evaluator Client</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#15222f;background:#f3f6f8}
    body{margin:0;padding:32px}
    main{max-width:1100px;margin:auto;background:white;border-radius:16px;padding:28px;box-shadow:0 12px 40px #15314718}
    h1{margin:0 0 8px;color:#123a54}p{color:#536575;line-height:1.5}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    label{display:block;font-weight:650;margin:14px 0 6px}
    input,textarea{width:100%;box-sizing:border-box;border:1px solid #cad5dd;border-radius:8px;padding:10px;font:14px ui-monospace,SFMono-Regular,Menlo,monospace}
    textarea{min-height:390px;resize:vertical;line-height:1.45}
    button{margin-top:16px;background:#146b91;color:white;border:0;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}
    pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#102532;color:#e8f2f7;padding:16px;border-radius:10px;min-height:390px;max-height:600px;overflow:auto}
    .row{display:grid;grid-template-columns:1fr 130px 130px;gap:12px}
    #status{font-weight:650;margin-top:12px;min-height:22px}
    @media(max-width:760px){body{padding:12px}main{padding:18px}.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
  <h1>PathSnap Evaluator Client</h1>
  <p>Send a trip's GPS track and road graph to the PathSnap API. This client accepts input data only and does not load reference routes or ground-truth labels.</p>
  <div class="row">
    <div><label for="api">Laptop 1 API base URL</label><input id="api" value="http://127.0.0.1:8000"></div>
    <div><label for="candidates">Candidates</label><input id="candidates" type="number" min="1" max="64" value="24"></div>
    <div><label for="transition">Transition weight</label><input id="transition" type="number" min="0" max="10" step="0.1" value="0"></div>
  </div>
  <div class="grid">
    <section>
      <label for="payload">Trip request JSON</label>
      <textarea id="payload" spellcheck="false">{
  "trip_id": "paste-trip-id",
  "track": [[-93.35, 44.86, 0], [-93.349, 44.861, 1]],
  "nodes": [[-93.35, 44.86], [-93.349, 44.861]],
  "arcs": [[0, 1]]
}</textarea>
      <button id="submit">Predict route</button>
      <div id="status" role="status"></div>
    </section>
    <section>
      <label for="result">API response</label>
      <pre id="result">Prediction output will appear here.</pre>
    </section>
  </div>
</main>
<script>
const button=document.getElementById('submit');
button.addEventListener('click',async()=>{
  const status=document.getElementById('status');
  const output=document.getElementById('result');
  button.disabled=true;
  status.textContent='Sending request…';
  output.textContent='';
  try{
    const base=document.getElementById('api').value.trim().replace(/\/$/,'');
    const trip=JSON.parse(document.getElementById('payload').value);
    trip.candidate_count=Number(document.getElementById('candidates').value);
    trip.transition_weight=Number(document.getElementById('transition').value);
    const response=await fetch(`${base}/predict`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(trip)
    });
    const data=await response.json();
    output.textContent=JSON.stringify(data,null,2);
    status.textContent=response.ok?`Success: ${data.matched_arc_indices?.length??0} GPS points matched.`:`Request failed (${response.status}).`;
  }catch(error){
    status.textContent='Request error. Check the API URL, network, and JSON input.';
    output.textContent=String(error);
  }finally{
    button.disabled=false;
  }
});
</script>
</body>
</html>
